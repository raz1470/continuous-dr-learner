# Builds the docs site with Sphinx on every pull request and deploys it to GitHub
# Pages on every push to main.
#
# One-off setup: Settings -> Pages -> Source = "GitHub Actions".
# The site serves article/index.html at /walkthrough.html (copied in by docs/conf.py).

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[docs]"
      # -W turns warnings into errors, so a broken reference fails the build.
      - name: Build
        run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
