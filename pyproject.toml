[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drcurves"
version = "0.1.0"
description = "Doubly robust, partially pooled dose-response curves for continuous treatments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "scipy>=1.8", "pandas", "scikit-learn>=1.2"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
experiments = ["doubleml>=0.9", "matplotlib>=3.5", "causal-curve", "playwright"]
dev = ["pytest", "matplotlib>=3.5", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["slow: long-running tests of experimental features (run with -m slow)"]
addopts = "-m 'not slow'"
